<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>wishlist · made for u</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#3257B8; --accent-deep:#121722; --accent-mid:#C3CDEC; --accent-tint:#C3CDEC;
  --ink:#121722; --muted:#8C96A0; --soft:#D4DDE3; --warm:#7A8A96; --warm-light:#E4E8EB;
  --cream:#F5F7F9; --white:#FFFFFF; --danger:#c0392b; --success:#5A8A6A;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--cream);color:var(--ink);font-family:Inter,sans-serif;
  -webkit-font-smoothing:antialiased;padding-bottom:70px}
.wrap{max-width:620px;margin:0 auto}

/* nav — matches .nav-logo */
.nav{background:var(--white);border-bottom:1px solid var(--warm-light);padding:14px 20px}
.nav-in{max-width:620px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.nav-logo{font-family:Inter,sans-serif;font-weight:800;font-size:23px;color:#000;
  letter-spacing:-.5px;text-transform:lowercase;flex-shrink:0}
.count{font-size:14px;color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}

/* banner — solid black */
.banner{background:#000;color:var(--white);padding:22px 20px}
.banner-in{max-width:620px;margin:0 auto}
.banner h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.5px;text-transform:lowercase}
.banner p{margin:6px 0 0;font-size:14px;color:#9BA5B4;line-height:1.5}

.add{padding:20px 20px 0}
.add-row{display:flex;gap:9px}
.add input{flex:1;min-width:0;padding:12px 16px;font-size:15px;font-family:Inter,sans-serif;
  color:var(--ink);background:var(--white);border:1.5px solid var(--soft);border-radius:24px;
  outline:none;transition:all .2s}
.add input::placeholder{color:var(--muted)}
.add input:focus{border-color:var(--accent)}
.btn{padding:12px 28px;border-radius:24px;border:none;font-family:Inter,sans-serif;
  font-size:15px;font-weight:500;cursor:pointer;transition:all .2s}
.btn-ink{background:#000;color:var(--white)}
.btn-ink:hover{opacity:.85}
.btn-ink:disabled{background:var(--soft);color:var(--muted);opacity:1;cursor:default}
.btn-outline{background:none;border:1.5px solid var(--soft);color:var(--ink)}
.hint{font-size:13px;color:var(--muted);margin:10px 4px 0;line-height:1.5}
.hint.err{color:var(--danger)}

.ccard{background:var(--white);border-radius:20px;padding:20px;
  box-shadow:0 2px 12px rgba(26,22,18,.08);margin-bottom:16px}

.scan{margin:16px 20px 0;display:flex;align-items:center;gap:12px;
  font-size:14px;color:var(--muted)}
.spin{width:16px;height:16px;border:2px solid var(--soft);border-top-color:var(--accent);
  border-radius:50%;animation:sp .7s linear infinite;flex-shrink:0}
@keyframes sp{to{transform:rotate(360deg)}}

#review{padding:16px 20px 0}
.rv-hd{margin-bottom:14px}
.rv-hd .t{font-size:16px;font-weight:600;letter-spacing:-.2px}
.rv-hd .s{font-size:13.5px;color:var(--muted);margin-top:4px;line-height:1.5}
.pick{display:flex;align-items:center;gap:12px;padding:11px 0;cursor:pointer;
  border-bottom:1px solid var(--warm-light)}
.pick:last-of-type{border-bottom:none}
.box{width:21px;height:21px;border:1.5px solid var(--soft);border-radius:7px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;transition:all .2s;background:var(--white)}
.pick.on .box{background:#000;border-color:#000}
.box svg{opacity:0;transition:opacity .15s}
.pick.on .box svg{opacity:1}
.pick .nm{font-size:15px;font-weight:500;line-height:1.35}
.pick .br{font-size:13px;color:var(--muted);margin-top:2px}
.rv-ft{display:flex;gap:9px;margin-top:16px}
.rv-ft .btn{flex:1;padding:12px 20px}

.list{padding:20px}
.item{background:var(--white);border-radius:20px;padding:16px;
  box-shadow:0 2px 12px rgba(26,22,18,.08);margin-bottom:12px;
  display:flex;gap:14px;align-items:flex-start;animation:in .24s ease}
@keyframes in{from{opacity:0;transform:translateY(-6px)}}
.item.out{opacity:0;transform:scale(.97);transition:all .2s}
.thumb{width:46px;height:60px;border-radius:12px;flex-shrink:0;object-fit:cover;
  background:var(--warm-light)}
.body{flex:1;min-width:0}
.name{font-size:15.5px;font-weight:600;line-height:1.35;letter-spacing:-.15px}
.brand{font-size:13.5px;color:var(--muted);margin-top:3px}
.src{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:5px 14px;
  background:var(--white);border:1.5px solid var(--soft);border-radius:20px;
  font-size:13px;color:var(--muted);text-decoration:none;font-family:Inter,sans-serif;
  max-width:100%;transition:all .2s}
.src:hover{border-color:var(--accent);color:var(--accent)}
.src span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.del{background:none;border:none;padding:6px;cursor:pointer;color:var(--soft);
  flex-shrink:0;line-height:0;border-radius:20px;transition:all .2s}
.del:hover{color:var(--danger);background:var(--cream)}

.empty{text-align:center;padding:56px 30px}
.empty .t{font-size:17px;font-weight:600;margin-bottom:8px;letter-spacing:-.2px}
.empty .s{font-size:14px;color:var(--muted);line-height:1.6}

.undo{position:fixed;left:50%;bottom:24px;transform:translate(-50%,90px);
  background:#000;color:var(--white);padding:13px 16px 13px 22px;border-radius:24px;
  display:flex;align-items:center;gap:16px;font-size:14.5px;font-weight:500;
  box-shadow:0 6px 24px rgba(26,22,18,.28);transition:transform .26s cubic-bezier(.2,.8,.3,1);
  z-index:50;max-width:calc(100vw - 32px)}
.undo.show{transform:translate(-50%,0)}
.undo b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.undo button{background:none;border:none;color:var(--accent-mid);font-family:Inter,sans-serif;
  font-size:14.5px;font-weight:600;cursor:pointer;padding:0;flex-shrink:0}
.stars{position:absolute;inset:0;pointer-events:none;
  background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22240%22%20height%3D%22240%22%20viewBox%3D%220%200%20240%20240%22%20shape-rendering%3D%22crispEdges%22%3E%3Cg%20fill%3D%22%23FFFFFF%22%3E%3Crect%20x%3D%2238%22%20y%3D%2248%22%20width%3D%221%22%20height%3D%229%22%2F%3E%3Crect%20x%3D%2234%22%20y%3D%2252%22%20width%3D%229%22%20height%3D%221%22%2F%3E%3Crect%20x%3D%2237%22%20y%3D%2251%22%20width%3D%223%22%20height%3D%223%22%2F%3E%3Crect%20x%3D%22176%22%20y%3D%2230%22%20width%3D%221%22%20height%3D%229%22%2F%3E%3Crect%20x%3D%22172%22%20y%3D%2234%22%20width%3D%229%22%20height%3D%221%22%2F%3E%3Crect%20x%3D%22175%22%20y%3D%2233%22%20width%3D%223%22%20height%3D%223%22%2F%3E%3Crect%20x%3D%22118%22%20y%3D%22159%22%20width%3D%221%22%20height%3D%229%22%2F%3E%3Crect%20x%3D%22114%22%20y%3D%22163%22%20width%3D%229%22%20height%3D%221%22%2F%3E%3Crect%20x%3D%22117%22%20y%3D%22162%22%20width%3D%223%22%20height%3D%223%22%2F%3E%3Crect%20x%3D%22206%22%20y%3D%22193%22%20width%3D%221%22%20height%3D%227%22%2F%3E%3Crect%20x%3D%22203%22%20y%3D%22196%22%20width%3D%227%22%20height%3D%221%22%2F%3E%3Crect%20x%3D%22205%22%20y%3D%22195%22%20width%3D%223%22%20height%3D%223%22%2F%3E%3Crect%20x%3D%2284%22%20y%3D%2220%22%20width%3D%221%22%20height%3D%225%22%2F%3E%3Crect%20x%3D%2282%22%20y%3D%2222%22%20width%3D%225%22%20height%3D%221%22%2F%3E%3Crect%20x%3D%22150%22%20y%3D%2294%22%20width%3D%221%22%20height%3D%225%22%2F%3E%3Crect%20x%3D%22148%22%20y%3D%2296%22%20width%3D%225%22%20height%3D%221%22%2F%3E%3Crect%20x%3D%2226%22%20y%3D%22130%22%20width%3D%221%22%20height%3D%225%22%2F%3E%3Crect%20x%3D%2224%22%20y%3D%22132%22%20width%3D%225%22%20height%3D%221%22%2F%3E%3Crect%20x%3D%22196%22%20y%3D%22116%22%20width%3D%221%22%20height%3D%225%22%2F%3E%3Crect%20x%3D%22194%22%20y%3D%22118%22%20width%3D%225%22%20height%3D%221%22%2F%3E%3Crect%20x%3D%2262%22%20y%3D%22204%22%20width%3D%221%22%20height%3D%225%22%2F%3E%3Crect%20x%3D%2260%22%20y%3D%22206%22%20width%3D%225%22%20height%3D%221%22%2F%3E%3Crect%20x%3D%22132%22%20y%3D%2256%22%20width%3D%221%22%20height%3D%225%22%2F%3E%3Crect%20x%3D%22130%22%20y%3D%2258%22%20width%3D%225%22%20height%3D%221%22%2F%3E%3Crect%20x%3D%22104%22%20y%3D%228%22%20width%3D%221%22%20height%3D%221%22%2F%3E%3Crect%20x%3D%22220%22%20y%3D%2268%22%20width%3D%221%22%20height%3D%221%22%2F%3E%3Crect%20x%3D%2210%22%20y%3D%2288%22%20width%3D%221%22%20height%3D%221%22%2F%3E%3Crect%20x%3D%22160%22%20y%3D%22140%22%20width%3D%221%22%20height%3D%221%22%2F%3E%3Crect%20x%3D%2272%22%20y%3D%22152%22%20width%3D%221%22%20height%3D%221%22%2F%3E%3Crect%20x%3D%22232%22%20y%3D%22158%22%20width%3D%221%22%20height%3D%221%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22182%22%20width%3D%221%22%20height%3D%221%22%2F%3E%3Crect%20x%3D%22188%22%20y%3D%22222%22%20width%3D%221%22%20height%3D%221%22%2F%3E%3Crect%20x%3D%2214%22%20y%3D%2242%22%20width%3D%221%22%20height%3D%221%22%2F%3E%3Crect%20x%3D%22126%22%20y%3D%22120%22%20width%3D%221%22%20height%3D%221%22%2F%3E%3Crect%20x%3D%22210%22%20y%3D%2210%22%20width%3D%221%22%20height%3D%221%22%2F%3E%3Crect%20x%3D%2290%22%20y%3D%22238%22%20width%3D%221%22%20height%3D%221%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E");background-repeat:repeat;background-size:240px 240px}

  background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22240%22%20height%3D%22240%22%20viewBox%3D%220%200%20240%20240%22%20shape-rendering%3D%22crispEdges%22%3E%3Cg%20fill%3D%22%23FFFFFF%22%3E%3Crect%20x%3D%2238%22%20y%3D%2248%22%20width%3D%221%22%20height%3D%229%22%2F%3E%3Crect%20x%3D%2234%22%20y%3D%2252%22%20width%3D%229%22%20height%3D%221%22%2F%3E%3Crect%20x%3D%2237%22%20y%3D%2251%22%20width%3D%223%22%20height%3D%223%22%2F%3E%3Crect%20x%3D%22176%22%20y%3D%2230%22%20width%3D%221%22%20height%3D%229%22%2F%3E%3Crect%20x%3D%22172%22%20y%3D%2234%22%20width%3D%229%22%20height%3D%221%22%2F%3E%3Crect%20x%3D%22175%22%20y%3D%2233%22%20width%3D%223%22%20height%3D%223%22%2F%3E%3Crect%20x%3D%22118%22%20y%3D%22159%22%20width%3D%221%22%20height%3D%229%22%2F%3E%3Crect%20x%3D%22114%22%20y%3D%22163%22%20width%3D%229%22%20height%3D%221%22%2F%3E%3Crect%20x%3D%22117%22%20y%3D%22162%22%20width%3D%223%22%20height%3D%223%22%2F%3E%3Crect%20x%3D%22206%22%20y%3D%22193%22%20width%3D%221%22%20height%3D%227%22%2F%3E%3Crect%20x%3D%22203%22%20y%3D%22196%22%20width%3D%227%22%20height%3D%221%22%2F%3E%3Crect%20x%3D%22205%22%20y%3D%22195%22%20width%3D%223%22%20height%3D%223%22%2F%3E%3Crect%20x%3D%2284%22%20y%3D%2220%22%20width%3D%221%22%20height%3D%225%22%2F%3E%3Crect%20x%3D%2282%22%20y%3D%2222%22%20width%3D%225%22%20height%3D%221%22%2F%3E%3Crect%20x%3D%22150%22%20y%3D%2294%22%20width%3D%221%22%20height%3D%225%22%2F%3E%3Crect%20x%3D%22148%22%20y%3D%2296%22%20width%3D%225%22%20height%3D%221%22%2F%3E%3Crect%20x%3D%2226%22%20y%3D%22130%22%20width%3D%221%22%20height%3D%225%22%2F%3E%3Crect%20x%3D%2224%22%20y%3D%22132%22%20width%3D%225%22%20height%3D%221%22%2F%3E%3Crect%20x%3D%22196%22%20y%3D%22116%22%20width%3D%221%22%20height%3D%225%22%2F%3E%3Crect%20x%3D%22194%22%20y%3D%22118%22%20width%3D%225%22%20height%3D%221%22%2F%3E%3Crect%20x%3D%2262%22%20y%3D%22204%22%20width%3D%221%22%20height%3D%225%22%2F%3E%3Crect%20x%3D%2260%22%20y%3D%22206%22%20width%3D%225%22%20height%3D%221%22%2F%3E%3Crect%20x%3D%22132%22%20y%3D%2256%22%20width%3D%221%22%20height%3D%225%22%2F%3E%3Crect%20x%3D%22130%22%20y%3D%2258%22%20width%3D%225%22%20height%3D%221%22%2F%3E%3Crect%20x%3D%22104%22%20y%3D%228%22%20width%3D%221%22%20height%3D%221%22%2F%3E%3Crect%20x%3D%22220%22%20y%3D%2268%22%20width%3D%221%22%20height%3D%221%22%2F%3E%3Crect%20x%3D%2210%22%20y%3D%2288%22%20width%3D%221%22%20height%3D%221%22%2F%3E%3Crect%20x%3D%22160%22%20y%3D%22140%22%20width%3D%221%22%20height%3D%221%22%2F%3E%3Crect%20x%3D%2272%22%20y%3D%22152%22%20width%3D%221%22%20height%3D%221%22%2F%3E%3Crect%20x%3D%22232%22%20y%3D%22158%22%20width%3D%221%22%20height%3D%221%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22182%22%20width%3D%221%22%20height%3D%221%22%2F%3E%3Crect%20x%3D%22188%22%20y%3D%22222%22%20width%3D%221%22%20height%3D%221%22%2F%3E%3Crect%20x%3D%2214%22%20y%3D%2242%22%20width%3D%221%22%20height%3D%221%22%2F%3E%3Crect%20x%3D%22126%22%20y%3D%22120%22%20width%3D%221%22%20height%3D%221%22%2F%3E%3Crect%20x%3D%22210%22%20y%3D%2210%22%20width%3D%221%22%20height%3D%221%22%2F%3E%3Crect%20x%3D%2290%22%20y%3D%22238%22%20width%3D%221%22%20height%3D%221%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E");background-repeat:repeat;background-size:300px 300px;

.banner{overflow:hidden}

<body>

<div class="nav"><div class="nav-in">
  <div class="nav-logo">made for u</div>
  <div class="count" id="count"></div>
</div></div>

<div class="banner"><div class="stars"></div><div class="banner-in">
  <h1>wishlist</h1>
  <p>Paste a TikTok and keep the products, not the scroll.</p>
</div></div>

<div class="wrap">
  <div class="add">
    <div class="add-row">
      <input id="url" type="url" inputmode="url" placeholder="Paste a TikTok link" autocomplete="off">
      <button class="btn btn-ink" id="go">Add</button>
    </div>
    <p class="hint" id="hint">Tap Share in TikTok, copy the link, paste it here.</p>
  </div>

  <div id="scan" style="display:none" class="scan">
    <div class="spin"></div><span>Reading the caption&hellip;</span>
  </div>

  <div id="review"></div>
  <div class="list" id="list"></div>
</div>

<div class="undo" id="undo"><b id="undoTxt"></b><button onclick="undo()">Undo</button></div>

<script>
var DEMO={products:[
  {name:'Soft Pinch Liquid Blush',brand:'Rare Beauty',shade:'Hope'},
  {name:'Peptide Lip Tint',brand:'Rhode',shade:'Toast'},
  {name:'Cloud Paint',brand:'Glossier',shade:'Puff'}],
  author:'@makeupbylio'};

var items=JSON.parse(localStorage.getItem('mfu_wishlist')||'[]');
var pending=null,lastDeleted=null,undoTimer=null;
function $(id){return document.getElementById(id)}
function save(){localStorage.setItem('mfu_wishlist',JSON.stringify(items))}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

$('go').onclick=function(){
  var raw=$('url').value.trim(); if(!raw)return;
  if(!/tiktok\.com/i.test(raw)){
    $('hint').className='hint err';
    $('hint').textContent='That is not a TikTok link. Copy it from the Share menu.';return;}
  $('hint').className='hint';
  $('hint').textContent='Tap Share in TikTok, copy the link, paste it here.';
  $('scan').style.display='flex'; $('review').innerHTML=''; $('go').disabled=true;
  loadVideo(raw).then(function(d){
    $('scan').style.display='none'; $('go').disabled=false;
    if(!d.products.length){$('hint').className='hint err';
      $('hint').textContent='No products named in that caption. Try one where the creator lists them.';return;}
    pending=d; renderReview(d);});
};
$('url').addEventListener('keydown',function(e){if(e.key==='Enter')$('go').click()});

/* Swap for: fetch('/api/import?url='+encodeURIComponent(raw)).then(function(r){return r.json()}) */
function loadVideo(raw){return new Promise(function(res){setTimeout(function(){
  res({products:DEMO.products.map(function(p){return Object.assign({},p)}),
    author:DEMO.author,url:raw,thumb:''});},900)})}

function renderReview(d){
  var chk='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
  var h='<div class="ccard"><div class="rv-hd"><div class="t">Found '+d.products.length+' product'+(d.products.length>1?'s':'')+'</div>'
    +'<div class="s">From '+esc(d.author)+'. Uncheck anything you do not want.</div></div>';
  d.products.forEach(function(p,i){
    h+='<div class="pick on" data-i="'+i+'" onclick="this.classList.toggle(\'on\')">'
      +'<div class="box">'+chk+'</div><div><div class="nm">'+esc(p.name)+'</div>'
      +'<div class="br">'+esc(p.brand)+(p.shade?' \u00b7 '+esc(p.shade):'')+'</div></div></div>';});
  h+='<div class="rv-ft"><button class="btn btn-outline" onclick="cancelReview()">Cancel</button>'
    +'<button class="btn btn-ink" onclick="commit()">Save</button></div></div>';
  $('review').innerHTML=h;
}
function cancelReview(){$('review').innerHTML='';pending=null}
function commit(){
  if(!pending)return;
  Array.prototype.forEach.call($('review').querySelectorAll('.pick.on'),function(el){
    var p=pending.products[+el.dataset.i];
    items.unshift({id:'w'+Date.now()+Math.random().toString(36).slice(2,7),
      name:p.name,brand:p.brand,shade:p.shade||'',author:pending.author,url:pending.url,thumb:pending.thumb});});
  save();cancelReview();$('url').value='';render();
}
function render(){
  $('count').textContent=items.length?items.length+' saved':'';
  if(!items.length){$('list').innerHTML='<div class="empty"><div class="t">Nothing saved yet</div>'
    +'<div class="s">Paste a TikTok link above and the products get pulled out for you.</div></div>';return;}
  $('list').innerHTML=items.map(function(it){
    var ph=it.thumb?'<img class="thumb" src="'+esc(it.thumb)+'" alt="">':'<div class="thumb"></div>';
    return '<div class="item" id="'+it.id+'">'+ph
      +'<div class="body"><div class="name">'+esc(it.name)+'</div>'
      +'<div class="brand">'+esc(it.brand)+(it.shade?' \u00b7 '+esc(it.shade):'')+'</div>'
      +'<a class="src" href="'+esc(it.url)+'" target="_blank" rel="noopener">'
      +'<svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>'
      +'<span>'+esc(it.author)+'</span></a></div>'
      +'<button class="del" onclick="del(\''+it.id+'\')" aria-label="Remove">'
      +'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>'
      +'</button></div>';}).join('');
}
function del(id){
  var i=items.findIndex(function(x){return x.id===id}); if(i<0)return;
  var el=$(id); lastDeleted={item:items[i],index:i};
  if(el)el.className='item out';
  setTimeout(function(){items.splice(i,1);save();render();
    $('undoTxt').textContent='Removed '+lastDeleted.item.name;
    $('undo').classList.add('show'); clearTimeout(undoTimer);
    undoTimer=setTimeout(function(){$('undo').classList.remove('show')},4500);},180);
}
function undo(){if(!lastDeleted)return;
  items.splice(lastDeleted.index,0,lastDeleted.item);save();render();
  $('undo').classList.remove('show');lastDeleted=null}
render();
</script>
</body>
</html>
